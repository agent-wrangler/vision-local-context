name: Feature request
description: Suggest an improvement to the public API, heuristics, or platform support.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or limitation you are running into.
      placeholder: I want to extract more structured data from settings screens...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or API you would like to see.
      placeholder: Add a lightweight extractor for ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workaround or alternative you evaluated.
