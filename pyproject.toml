[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-local-context"
version = "0.1.0"
description = "Local screenshot and image-understanding helpers for OCR, layout extraction, and LLM-ready prompt context."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vision Local Context contributors" }
]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
caption = [
  "transformers>=4.37",
  "torch>=2.1",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["vision_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
