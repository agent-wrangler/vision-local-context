[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-local-context"
version = "0.1.0"
description = "Local screenshot and image-understanding helpers for OCR, layout extraction, and LLM-ready prompt context."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ocr", "vision", "screenshots", "ui-analysis", "llm", "image-understanding"]
authors = [
  { name = "Vision Local Context contributors" }
]
urls = { Homepage = "https://github.com/agent-wrangler/vision-local-context", Repository = "https://github.com/agent-wrangler/vision-local-context", Issues = "https://github.com/agent-wrangler/vision-local-context/issues" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
caption = [
  "transformers>=4.37",
  "torch>=2.1",
]
test = [
  "pytest>=8.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["vision_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
